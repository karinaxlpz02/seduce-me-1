<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <filter id="paper-grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".78" numOctaves="3" seed="23" result="noise" />
    <feColorMatrix in="noise" type="saturate" values="0" result="gray-noise" />
    <feComponentTransfer in="gray-noise">
      <feFuncA type="table" tableValues="0 .95" />
    </feComponentTransfer>
  </filter>
  <rect width="128" height="128" fill="#fff" filter="url(#paper-grain)" />
</svg>
